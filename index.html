<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>Мои тренировки</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Тренировки"><style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#f5f6f7;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:28px 20px 12px}h1{font-size:29px;margin:0 0 7px}.muted{color:#aeb4bd;font-size:14px}.tabs{display:flex;gap:8px;padding:8px 16px;overflow:auto}.tabs button{white-space:nowrap}button{border:0;border-radius:13px;padding:12px 15px;background:#292e37;color:white;font-size:15px}button.active,.primary{background:#b9f568;color:#172008;font-weight:700}main{padding:8px 16px 100px;max-width:700px;margin:auto}.card{background:#1d2129;border:1px solid #333842;border-radius:18px;padding:17px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.exercise{border-top:1px solid #353b44;padding:13px 0}.exercise:first-of-type{border:0}input{width:78px;background:#111318;color:white;border:1px solid #59606b;border-radius:9px;padding:10px;font-size:16px}input[type=checkbox]{width:22px;height:22px;accent-color:#b9f568}label{display:inline-flex;align-items:center;gap:5px;font-size:13px}.sets{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:9px 0}.small{font-size:13px;color:#aeb4bd}details{margin-top:8px}summary{color:#b9f568;cursor:pointer}.hidden{display:none}footer{position:fixed;bottom:0;left:0;right:0;background:#151820;border-top:1px solid #333842;padding:10px 16px max(12px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:#b5bac4}
a.video{display:inline-block;background:#b9f568;color:#172008;border-radius:12px;padding:11px 14px;text-decoration:none;font-weight:700}details p{line-height:1.5}.video-frame{position:relative;width:100%;aspect-ratio:16/9;margin:12px 0;border-radius:12px;overflow:hidden;background:#090909}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head><body><header><h1>Мои тренировки</h1><div class="muted">Персональный план · 2 силовые в неделю · v0.4</div></header><nav class="tabs"><button onclick="show('today')" id="tab-today">Сегодня</button><button onclick="show('plans')" id="tab-plans">Программы</button><button onclick="show('history')" id="tab-history">История</button><button onclick="show('progress')" id="tab-progress">Прогресс</button></nav><main id="app"></main><footer>Данные хранятся в браузере этого устройства · Делайте резервные копии</footer>
<script>
const plans=[{"name": "Full Body A", "day": "Вторник", "ex": [["Присед с гантелью", 3, 10], ["Жим гантелей лёжа", 3, 10], ["Тяга верхнего блока", 3, 12], ["Румынская тяга", 3, 10], ["Жим гантелей сидя", 2, 12], ["Планка", 3, 30]]}, {"name": "Full Body B", "day": "Пятница", "ex": [["Жим ногами", 3, 12], ["Горизонтальная тяга блока", 3, 12], ["Жим гантелей на наклонной скамье", 3, 10], ["Ягодичный мост", 3, 12], ["Подъём гантелей на бицепс", 2, 12], ["Разгибание рук на блоке", 2, 12]]}];
const instructions={
"Присед с гантелью":["Держите гантель у груди. Стопы устойчиво, колени направлены по линии носков. Опускайтесь контролируемо.","Вдох вниз, выдох при подъёме.","Не округляйте спину, не отрывайте пятки."],
"Жим гантелей лёжа":["Лопатки сведены, стопы на полу. Опускайте гантели контролируемо, локти не разводите строго в стороны.","Вдох вниз, выдох вверх.","Не ударяйте гантели друг о друга и не прогибайтесь чрезмерно."],
"Тяга верхнего блока":["Тяните рукоять к верхней части груди, опуская лопатки. Не раскачивайте корпус.","Выдох при тяге, вдох при возврате.","Не тяните за голову, не дёргайте вес."],
"Румынская тяга":["Отводите таз назад, колени слегка согнуты, спина нейтральна. Вес держите близко к ногам.","Вдох при опускании, выдох при подъёме.","Не округляйте поясницу и не превращайте движение в присед."],
"Жим гантелей сидя":["Держите корпус устойчиво, выжимайте гантели вверх в комфортной амплитуде.","Выдох вверх, вдох вниз.","Не переразгибайте поясницу."],
"Планка":["Локти под плечами, корпус прямой, живот напряжён.","Дышите ровно, не задерживайте дыхание.","Не провисайте в пояснице."],
"Жим ногами":["Стопы на платформе устойчиво, опускайте вес до комфортной глубины, не отрывая таз.","Вдох при сгибании, выдох при выжимании.","Не выпрямляйте колени рывком."],
"Горизонтальная тяга блока":["Начните со сведения лопаток, затем ведите локти назад.","Выдох при тяге, вдох при возврате.","Не раскачивайтесь и не округляйте спину."],
"Жим гантелей на наклонной скамье":["Установите небольшой наклон скамьи, лопатки сведены, движение плавное.","Вдох вниз, выдох вверх.","Не разводите локти чрезмерно."],
"Ягодичный мост":["Упритесь стопами, поднимите таз за счёт ягодиц, сохраняйте нейтральную поясницу.","Выдох вверх, вдох вниз.","Не переразгибайте поясницу."],
"Подъём гантелей на бицепс":["Локти держите у корпуса, поднимайте гантели без раскачивания.","Выдох при подъёме, вдох при опускании.","Не помогайте корпусом."],
"Разгибание рук на блоке":["Локти у корпуса, разгибайте руки плавно.","Выдох при разгибании, вдох при возврате.","Не двигайте плечами и корпусом."]
};
const guideExtra={"Присед с гантелью": ["Квадрицепсы, ягодичные, мышцы корпуса", "Встаньте на ширине плеч, удерживайте гантель у груди. Направьте колени по линии стоп, отведите таз вниз между ног, поднимитесь через всю стопу.", "Не допускайте отрыва пяток, сведения коленей внутрь и потери нейтрального положения спины.", "Начните с небольшой глубины, которую можете контролировать."], "Жим гантелей лёжа": ["Грудные, трицепсы, передние дельты", "Поставьте стопы на пол, сведите лопатки. Опускайте гантели к бокам груди, затем выжимайте без удара друг о друга.", "Не разводите локти под прямым углом к корпусу, не отбивайте вес.", "При боли в плече уменьшите амплитуду и вес."], "Тяга верхнего блока": ["Широчайшие, бицепсы, мышцы лопаток", "Сядьте устойчиво, опустите плечи. Тяните рукоять к верхней части груди, локти ведите вниз. Медленно верните вес.", "Не тяните блок за шею, не отклоняйтесь рывком назад.", "Подбирайте вес без раскачивания."], "Румынская тяга": ["Задняя поверхность бедра, ягодичные, разгибатели спины", "Слегка согните колени, отводите таз назад. Опускайте вес вдоль ног с нейтральной спиной до ощутимого натяжения бедра, затем выпрямитесь.", "Не округляйте спину и не опускайтесь глубже доступной подвижности.", "Освойте наклон без веса, затем постепенно увеличивайте нагрузку."], "Жим гантелей сидя": ["Дельтовидные, трицепсы", "Сядьте с опорой спины. Держите предплечья примерно вертикально и плавно выжимайте гантели над плечами.", "Не прогибайте поясницу и не опускайте локти резко.", "При дискомфорте в плечах используйте нейтральный хват."], "Планка": ["Поперечная и прямая мышцы живота, ягодичные", "Поставьте локти под плечами, напрягите ягодицы и пресс. Удерживайте прямую линию от головы до пяток.", "Не провисайте поясницей и не задерживайте дыхание.", "Прекратите подход при потере положения корпуса."], "Жим ногами": ["Квадрицепсы, ягодичные", "Расположите стопы на платформе, прижмите таз и спину. Сгибайте колени в контролируемой амплитуде, затем выжимайте платформу.", "Не отрывайте таз, не сводите колени и не блокируйте суставы рывком.", "Не опускайте платформу глубже положения, в котором поясница остаётся стабильной."], "Горизонтальная тяга блока": ["Широчайшие, ромбовидные, бицепсы", "Сядьте устойчиво, сохраните нейтральную спину. Потяните рукоять к животу, ведите локти назад, затем плавно распрямите руки.", "Не тяните корпусом и не поднимайте плечи к ушам.", "Уменьшите вес, если приходится раскачиваться."], "Жим гантелей на наклонной скамье": ["Верх грудных, трицепсы, передние дельты", "Установите наклон около 15–30°, сведите лопатки. Опустите гантели контролируемо и выжмите вверх.", "Не ставьте чрезмерно крутой наклон, не разводите локти широко.", "Выбирайте комфортную амплитуду для плеч."], "Ягодичный мост": ["Большая ягодичная, задняя поверхность бедра", "Поставьте стопы устойчиво, поднимите таз, напрягая ягодицы. Вверху корпус и бёдра образуют линию.", "Не выгибайте поясницу вместо разгибания таза.", "Начните без отягощения, пока не освоите движение."], "Подъём гантелей на бицепс": ["Бицепс, плечевая мышца", "Встаньте ровно, локти держите у корпуса. Согните руки без движения плечами и плавно опустите вес.", "Не раскачивайтесь и не забрасывайте гантели.", "Не используйте инерцию для последних повторов."], "Разгибание рук на блоке": ["Трицепсы", "Зафиксируйте локти возле туловища, разогните руки вниз и контролируемо вернитесь.", "Не двигайте плечами и не наклоняйтесь всем телом на рукоять.", "Выберите вес, позволяющий сохранять локти неподвижными."]};
let tab='today',selected=0,started=false,seconds=0,timer=null;
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function show(t){tab=t;render()}
function choose(i){selected=i;started=false;tab='today';render()}
function start(){started=true;render()}
function tick(){seconds--;document.getElementById('clock').textContent=seconds+' с';if(seconds<=0){clearInterval(timer);alert('Отдых закончен')}}
function rest(){clearInterval(timer);seconds=90;render();timer=setInterval(tick,1000)}
function finish(){const entries=[...document.querySelectorAll('.setrow')].map(x=>({exercise:x.dataset.name,set:+x.dataset.set,weight:+x.querySelector('.weight').value||0,reps:+x.querySelector('.reps').value||0,done:x.querySelector('.done').checked}));const completed=entries.filter(x=>x.done);if(!completed.length){alert('Отметьте хотя бы один выполненный подход');return}let h=get('history',[]);h.push({date:new Date().toISOString(),plan:plans[selected].name,entries:completed});save('history',h);started=false;tab='history';render()}
function videoId(url){let m=String(url).match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
function saveVideo(name){let input=document.getElementById('video-'+encodeURIComponent(name));let id=videoId(input.value);if(!id){alert('Вставьте ссылку на видео YouTube');return}let links=get('exerciseVideoLinks',{});links[name]=id;save('exerciseVideoLinks',links);let box=document.getElementById('video-box-'+encodeURIComponent(name));box.innerHTML='<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" title="Видео упражнения" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';}
function videoPanel(name){let id=get('exerciseVideoLinks',{})[name]||(name==='Присед с гантелью'?'9W5KAqHfDe8':null);let key=encodeURIComponent(name);return `<div id="video-box-${key}">${id?`<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Видео: ${name}" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`:'<p class="small">Проверенное видео ещё не закреплено. Найдите подходящий ролик и вставьте ссылку ниже.</p>'}</div><div class="small">Ссылка на видео сохраняется для этого упражнения на устройстве.</div><div class="sets"><input style="flex:1;min-width:150px" id="video-${key}" placeholder="Ссылка на YouTube" aria-label="Ссылка на видео"><button type="button" onclick="saveVideo(decodeURIComponent('${key}'))">Встроить видео</button></div>`}
function exerciseCard(ex){let [name,n,reps]=ex;let prev=get('history',[]).slice().reverse().flatMap(x=>x.entries).find(x=>x.exercise===name);return `<div class="exercise"><h3>${name}</h3><div class="small">${n} подхода · ${reps} ${name==='Планка'?'секунд':'повторений'}${prev?' · прошлый вес: '+prev.weight+' кг':''}</div>${started?Array.from({length:n},(_,i)=>`<div class="sets setrow" data-name="${name}" data-set="${i+1}"><span>${i+1}.</span><label>кг <input class="weight" type="number" min="0" step=".5" value="${prev?.weight||0}"></label><label>${name==='Планка'?'сек':'раз'} <input class="reps" type="number" min="0" value="${reps}"></label><label><input class="done" type="checkbox">✓</label></div>`).join(''):''}<details><summary>📖 Инструкция и видео</summary><p><b>Работающие мышцы:</b> ${guideExtra[name][0]}</p><p><b>Пошаговая техника:</b> ${guideExtra[name][1]}</p><p><b>Дыхание:</b> ${instructions[name][1]}</p><p><b>Частые ошибки:</b> ${guideExtra[name][2]}</p><p><b>Безопасность:</b> ${guideExtra[name][3]}</p>${videoPanel(name)}<p><a class="video" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' правильная техника выполнения упражнения')}">▶ Подобрать видео на YouTube</a></p><p class="small">Откроется поиск обучающих видео на YouTube. Для остальных упражнений ролики пока не проверены; сверяйте демонстрацию с текстовой инструкцией.</p></details></div>`}
function render(){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.id==='tab-'+tab));let a=document.getElementById('app');if(tab==='today'){let p=plans[selected];a.innerHTML=`<div class="card"><div class="muted">${p.day}</div><h2>${p.name}</h2><div class="muted">Начните с комфортных рабочих весов; оставляйте 2–3 повторения в запасе.</div><p><button onclick="choose(${1-selected})">Переключить на ${plans[1-selected].name}</button></p>${p.ex.map(exerciseCard).join('')}${started?`<div class="row"><button onclick="rest()">Отдых 90 сек</button><b id="clock">${seconds>0?seconds+' с':''}</b></div><p><button class="primary" onclick="finish()">Завершить тренировку</button></p>`:`<button class="primary" onclick="start()">Начать тренировку</button>`}</div>`}else if(tab==='plans'){a.innerHTML=plans.map((p,i)=>`<div class="card"><h2>${p.name}</h2><div class="muted">${p.day} · ${p.ex.length} упражнений</div><p>${p.ex.map(e=>e[0]).join(' · ')}</p><button class="primary" onclick="choose(${i})">Открыть</button></div>`).join('')}else if(tab==='history'){let h=get('history',[]);a.innerHTML=`<h2>История занятий</h2>${h.length?h.slice().reverse().map(x=>`<div class="card"><h3>${x.plan}</h3><div class="muted">${new Date(x.date).toLocaleString('ru-RU')}</div><p>${x.entries.length} выполненных подходов</p>${x.entries.map(e=>`<div class="small">${e.exercise}: ${e.weight} кг × ${e.reps}</div>`).join('')}</div>`).join(''):'<div class="card">Пока нет завершённых тренировок.</div>'}<button onclick="backup()">Скачать резервную копию</button>`}else{let h=get('history',[]);let sets=h.flatMap(x=>x.entries);let volume=sets.reduce((s,x)=>s+x.weight*x.reps,0);a.innerHTML=`<div class="card"><h2>Прогресс</h2><p>Тренировок: <b>${h.length}</b></p><p>Выполненных подходов: <b>${sets.length}</b></p><p>Суммарный тоннаж: <b>${volume.toFixed(1)} кг</b></p><div class="muted">Тоннаж — сумма веса × повторения; упражнения с весом тела не учитываются корректно.</div></div>`}}
function backup(){let b=new Blob([JSON.stringify({history:get('history',[])},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
}
</script></body></html>
